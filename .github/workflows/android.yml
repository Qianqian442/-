name: Build 午夜回声 404 Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/build-npc-models.sh'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate realistic full-body NPC models
        run: bash scripts/build-npc-models.sh
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Build game assets
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Enforce offline-only Android permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'xmlns:tools=' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          import re
          s = re.sub(r'\s*<uses-permission android:name="android\.permission\.INTERNET"\s*/>', '', s)
          marker = '<application'
          removal = '<uses-permission android:name="android.permission.INTERNET" tools:node="remove" />\n    '
          if marker not in s:
              raise SystemExit("Android manifest has no application element")
          s = s.replace(marker, removal + marker, 1)
          p.write_text(s)
          print("Removed INTERNET permission from the final merged manifest.")
          PY
      - name: Sync Android project
        run: npx cap sync android
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle dependency/build attempt $attempt failed; waiting 25 seconds before retry."
              sleep 25
            fi
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Midnight-Echo-404-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
